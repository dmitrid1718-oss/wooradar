name: Refresh WooRadar observation feed
on:
  push:
    branches: [main]
    paths:
      - 'tools/collect.py'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: wooradar-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch NASA/JPL observations
        run: python tools/collect.py
      - name: Save valid observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified observation feed"
            git push
          fi
