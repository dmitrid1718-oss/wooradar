name: Morning news refresh
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source-linked daily news snapshot
        env:
          NEWS_QUERY: "UAP unidentified anomalous phenomena consciousness research neuroscience anomalous AI"
        run: python scripts/update_news.py
      - name: Commit changed news only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh morning news snapshot"
            git push
          fi
